<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1eb;
      --surface: #ffffff;
      --ink: #1a1a18;
      --ink-light: #6b6b60;
      --accent: #3d6b4f;
      --accent-light: #e8f0eb;
      --accent-hover: #2e5240;
      --danger: #c0392b;
      --danger-light: #fdecea;
      --border: #e0ddd4;
      --shadow: 0 2px 12px rgba(26,26,24,0.08);
      --shadow-lg: 0 8px 32px rgba(26,26,24,0.12);
      --radius: 12px;
      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--ink);
      padding: 24px 16px 60px;
    }

    /* Subtle background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231a1a18' fill-opacity='0.025'%3E%3Crect x='0' y='0' width='1' height='1'/%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 580px;
      margin: 0 auto;
      animation: fadeUp 0.5s ease both;
    }

    /* Header */
    .header {
      margin-bottom: 36px;
      animation: fadeUp 0.5s 0.05s ease both;
    }

    .header-top {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 4px;
    }

    .header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 6vw, 2.8rem);
      letter-spacing: -0.5px;
      color: var(--ink);
      line-height: 1;
    }

    .note-count {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink-light);
      background: var(--border);
      padding: 3px 9px;
      border-radius: 20px;
      transition: var(--transition);
    }

    .header p {
      font-size: 0.9rem;
      color: var(--ink-light);
      font-weight: 300;
    }

    /* Card */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
      letter-spacing: -0.2px;
    }

    .card-body {
      padding: 18px 20px;
    }

    /* Input group */
    .input-group {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .input-wrap {
      flex: 1;
      position: relative;
    }

    input[type="text"], input[type="number"], textarea {
      width: 100%;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--ink);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      -webkit-appearance: none;
    }

    input::placeholder, textarea::placeholder { color: var(--ink-light); }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61,107,79,0.12);
      background: #fff;
    }

    /* Buttons */
    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 14px rgba(61,107,79,0.25); }

    .btn-ghost {
      background: transparent;
      color: var(--ink-light);
      padding: 6px 10px;
    }
    .btn-ghost:hover { background: var(--border); color: var(--ink); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      padding: 6px 10px;
    }
    .btn-danger:hover { background: var(--danger-light); }

    .btn-sm {
      font-size: 0.8rem;
      padding: 5px 12px;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ink);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 11px 20px;
      border-radius: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 1000;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.success { background: var(--accent); }
    .toast.error { background: var(--danger); }

    /* Notes List */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      box-shadow: var(--shadow);
      animation: slideIn 0.3s cubic-bezier(0.34, 1.4, 0.64, 1) both;
      transition: box-shadow var(--transition), border-color var(--transition);
    }

    .note-item:hover {
      box-shadow: var(--shadow-lg);
      border-color: #ccc9be;
    }

    .note-item.removing {
      animation: slideOut 0.28s ease forwards;
    }

    .note-num {
      font-family: 'DM Serif Display', serif;
      font-size: 0.85rem;
      color: var(--ink-light);
      min-width: 28px;
      padding-top: 2px;
      font-style: italic;
    }

    .note-content { flex: 1; min-width: 0; }

    .note-text {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.5;
      word-break: break-word;
    }

    .note-meta {
      font-size: 0.75rem;
      color: var(--ink-light);
      margin-top: 4px;
      font-weight: 300;
    }

    .note-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity var(--transition);
      flex-shrink: 0;
    }
    .note-item:hover .note-actions { opacity: 1; }

    /* Inline edit */
    .note-edit-form {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .note-edit-form.open { display: flex; }

    .note-edit-actions { display: flex; gap: 8px; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-light);
      animation: fadeUp 0.4s ease both;
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      display: block;
      opacity: 0.5;
    }

    .empty-state p { font-size: 0.9rem; font-style: italic; }

    /* Fetch section */
    .fetch-result {
      margin-top: 14px;
      padding: 14px;
      background: var(--accent-light);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      font-size: 0.9rem;
      line-height: 1.6;
      display: none;
      animation: fadeUp 0.3s ease both;
    }
    .fetch-result.visible { display: block; }
    .fetch-result .label { font-weight: 600; color: var(--accent); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Keyframes */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px) scale(0.98); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slideOut {
      to { opacity: 0; transform: translateX(12px) scale(0.97); max-height: 0; padding: 0; margin: 0; }
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* Section label */
    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--ink-light);
      margin-bottom: 12px;
    }

    @media (max-width: 480px) {
      body { padding: 16px 12px 60px; }
      .input-group { flex-direction: column; }
      .btn-primary { width: 100%; justify-content: center; }
      .note-actions { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <h1>Notes</h1>
      <span class="note-count" id="note-count">0 notes</span>
    </div>
    <p>Capture and manage your thoughts.</p>
  </div>

  <!-- Create Note -->
  <div class="card" style="animation-delay:0.08s">
    <div class="card-header">
      <span class="card-title">New Note</span>
    </div>
    <div class="card-body">
      <div class="input-group">
        <div class="input-wrap">
          <input type="text" id="noteText" placeholder="What's on your mind?" autocomplete="off" onkeydown="if(event.key==='Enter') createNote()">
        </div>
        <button class="btn btn-primary" onclick="createNote()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Save
        </button>
      </div>
    </div>
  </div>

  <!-- All Notes -->
  <div class="card" style="animation-delay:0.14s">
    <div class="card-header">
      <span class="card-title">All Notes</span>
      <button class="btn btn-ghost btn-sm" onclick="refreshList()">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1 6.5A5.5 5.5 0 0 1 11.5 4M12 1v3h-3M12 6.5A5.5 5.5 0 0 1 1.5 9M1 12V9h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Refresh
      </button>
    </div>
    <div class="card-body" style="padding-top:14px">
      <div id="notes-list" class="notes-list">
        <div class="empty-state">
          <span class="empty-icon">📋</span>
          <p>No notes yet. Create your first one above.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Fetch by ID -->
  <div class="card" style="animation-delay:0.2s">
    <div class="card-header">
      <span class="card-title">Look Up Note</span>
    </div>
    <div class="card-body">
      <div class="input-group">
        <div class="input-wrap">
          <input type="number" id="getId" placeholder="Enter note ID" min="1">
        </div>
        <button class="btn btn-primary" onclick="getNote()">Fetch</button>
      </div>
      <div class="fetch-result" id="noteResult"></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── In-memory store (replaces real API calls) ───────────────────
let notes = [];
let nextId = 1;

function apiCreate(text) {
  const note = { id: nextId++, text, createdAt: new Date().toISOString() };
  notes.push(note);
  return { ok: true, status: 201, data: note };
}

function apiGet(id) {
  const note = notes.find(n => n.id === Number(id));
  return note ? { ok: true, status: 200, data: note } : { ok: false, status: 404 };
}

function apiGetAll() {
  return { ok: true, status: 200, data: [...notes] };
}

function apiUpdate(id, text) {
  const note = notes.find(n => n.id === Number(id));
  if (!note) return { ok: false, status: 404 };
  note.text = text;
  note.updatedAt = new Date().toISOString();
  return { ok: true, status: 200, data: note };
}

function apiDelete(id) {
  const i = notes.findIndex(n => n.id === Number(id));
  if (i === -1) return { ok: false, status: 404 };
  notes.splice(i, 1);
  return { ok: true, status: 204 };
}

// ─── Toast ───────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ─── Helpers ─────────────────────────────────────────────────────
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function updateCount() {
  const el = document.getElementById('note-count');
  el.textContent = notes.length === 1 ? '1 note' : `${notes.length} notes`;
}

// ─── Render Notes List ───────────────────────────────────────────
function renderNotes(data) {
  const list = document.getElementById('notes-list');
  if (!data.length) {
    list.innerHTML = `
      <div class="empty-state">
        <span class="empty-icon">📋</span>
        <p>No notes yet. Create your first one above.</p>
      </div>`;
    return;
  }

  list.innerHTML = data.map((note, i) => `
    <div class="note-item" id="note-item-${note.id}" style="animation-delay:${i * 0.04}s">
      <div class="note-num">#${note.id}</div>
      <div class="note-content">
        <div class="note-text" id="note-text-${note.id}">${escHtml(note.text)}</div>
        <div class="note-meta">${formatDate(note.updatedAt || note.createdAt)}${note.updatedAt ? ' · edited' : ''}</div>

        <!-- Inline edit form -->
        <div class="note-edit-form" id="edit-form-${note.id}">
          <input type="text" id="edit-input-${note.id}" value="${escAttr(note.text)}" onkeydown="if(event.key==='Enter') saveEdit(${note.id}); if(event.key==='Escape') cancelEdit(${note.id})">
          <div class="note-edit-actions">
            <button class="btn btn-primary btn-sm" onclick="saveEdit(${note.id})">Save</button>
            <button class="btn btn-ghost btn-sm" onclick="cancelEdit(${note.id})">Cancel</button>
          </div>
        </div>
      </div>
      <div class="note-actions">
        <button class="btn btn-ghost btn-sm" title="Edit" onclick="startEdit(${note.id})">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M9 2l2 2-6 6H3V8l6-6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-danger btn-sm" title="Delete" onclick="removeNote(${note.id})">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M5 3.5V2.5h3v1M4 3.5l.5 7h4l.5-7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}

// ─── CRUD Actions ─────────────────────────────────────────────────
function createNote() {
  const input = document.getElementById('noteText');
  const text = input.value.trim();
  if (!text) { input.focus(); showToast('Please write something first.', 'error'); return; }

  const res = apiCreate(text);
  input.value = '';
  input.focus();
  showToast('Note saved!');
  refreshList();
}

function getNote() {
  const id = document.getElementById('getId').value;
  const resultEl = document.getElementById('noteResult');
  if (!id) { showToast('Enter a note ID.', 'error'); return; }

  const res = apiGet(id);
  if (!res.ok) {
    resultEl.className = 'fetch-result visible';
    resultEl.style.borderLeftColor = 'var(--danger)';
    resultEl.style.background = 'var(--danger-light)';
    resultEl.innerHTML = `<span class="label" style="color:var(--danger)">Not Found</span><br>No note with ID ${id} exists.`;
    return;
  }

  const n = res.data;
  resultEl.className = 'fetch-result visible';
  resultEl.style.borderLeftColor = 'var(--accent)';
  resultEl.style.background = 'var(--accent-light)';
  resultEl.innerHTML = `
    <span class="label">Found</span><br>
    <strong>ID:</strong> ${n.id}<br>
    <strong>Text:</strong> ${escHtml(n.text)}<br>
    <strong>Created:</strong> ${formatDate(n.createdAt)}
    ${n.updatedAt ? `<br><strong>Updated:</strong> ${formatDate(n.updatedAt)}` : ''}
  `;
}

function startEdit(id) {
  const form = document.getElementById(`edit-form-${id}`);
  form.classList.add('open');
  const input = document.getElementById(`edit-input-${id}`);
  input.focus();
  input.select();
}

function cancelEdit(id) {
  document.getElementById(`edit-form-${id}`).classList.remove('open');
}

function saveEdit(id) {
  const input = document.getElementById(`edit-input-${id}`);
  const text = input.value.trim();
  if (!text) { input.focus(); return; }

  const res = apiUpdate(id, text);
  if (!res.ok) { showToast('Note not found.', 'error'); return; }

  showToast('Note updated!');
  refreshList();
}

function removeNote(id) {
  const el = document.getElementById(`note-item-${id}`);
  if (el) {
    el.classList.add('removing');
    setTimeout(() => {
      apiDelete(id);
      refreshList();
      showToast('Note deleted.');
    }, 260);
  }
}

function refreshList() {
  const res = apiGetAll();
  renderNotes(res.data);
  updateCount();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─── Init ─────────────────────────────────────────────────────────
refreshList();
</script>
</body>
</html>
