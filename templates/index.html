<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Mulish:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Mulish', sans-serif;
      background: #141414;
      color: #e8e8e4;
      min-height: 100vh;
      padding: 32px 20px 80px;
    }

    .app { max-width: 620px; margin: 0 auto; }

    /* ── Header ── */
    .header { margin-bottom: 40px; animation: fadeUp 0.5s ease both; }
    .header-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #f59e0b;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      opacity: 0.8;
    }
    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
      color: #e8e8e4;
    }
    .header h1 span { color: #f59e0b; }

    /* ── Cards ── */
    .card {
      background: #1c1c1c;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid #2e2e2e;
      gap: 10px;
    }
    .card-label { display: flex; align-items: center; gap: 10px; }
    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #e8e8e4;
    }
    .card-body { padding: 16px 18px; }

    /* ── Method pills ── */
    .method-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .post { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .get  { background: rgba(34,197,94,0.12);  color: #4ade80; }
    .del  { background: rgba(239,68,68,0.12);  color: #f87171; }
    .route {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #737370;
    }

    /* ── Inputs ── */
    .input-row { display: flex; gap: 8px; align-items: stretch; }
    input[type="text"],
    input[type="number"] {
      flex: 1;
      font-family: 'Mulish', sans-serif;
      font-size: 0.9rem;
      color: #e8e8e4;
      background: #242424;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 10px 14px;
      outline: none;
      -webkit-appearance: none;
    }
    input::placeholder { color: #4a4a46; }
    input:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
    }

    /* ── Buttons ── */
    .btn {
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      letter-spacing: 0.2px;
      transition: all 0.18s ease;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-amber { background: #f59e0b; color: #0a0a0a; }
    .btn-amber:hover { background: #fbbf24; box-shadow: 0 4px 16px rgba(245,158,11,0.3); }

    .btn-red { background: #ef4444; color: #ffffff; }
    .btn-red:hover { background: #dc2626; box-shadow: 0 4px 16px rgba(239,68,68,0.3); }

    .btn-ghost {
      background: #242424;
      color: #737370;
      border: 1px solid #3a3a3a;
      padding: 6px 12px;
      font-size: 0.78rem;
    }
    .btn-ghost:hover { background: #2e2e2e; color: #e8e8e4; }

    /* ── Result boxes ── */
    .result {
      margin-top: 12px;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      line-height: 1.7;
      display: none;
      border-left: 3px solid transparent;
      animation: fadeUp 0.25s ease both;
    }
    .result.visible { display: block; }
    .result.ok  { background: rgba(34,197,94,0.1);  border-left-color: #22c55e; color: #86efac; }
    .result.err { background: rgba(239,68,68,0.1);  border-left-color: #ef4444; color: #fca5a5; }
    .result .rl {
      color: #737370;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 6px;
    }
    .result b { color: #e8e8e4; font-weight: 500; }

    /* ── Notes list ── */
    .notes-wrap { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .note-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #242424;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 12px 14px;
      animation: slideIn 0.28s ease both;
    }
    .note-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #f59e0b;
      padding-top: 2px;
      min-width: 26px;
      opacity: 0.7;
    }
    .note-body { flex: 1; min-width: 0; }
    .note-text { font-size: 0.88rem; color: #e8e8e4; line-height: 1.5; word-break: break-word; }
    .note-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: #4a4a46;
      margin-top: 4px;
    }
    .note-del {
      background: transparent;
      border: none;
      color: #4a4a46;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }
    .note-row:hover .note-del { opacity: 1; }
    .note-del:hover { color: #ef4444; background: rgba(239,68,68,0.1); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 32px 20px;
      color: #4a4a46;
      font-size: 0.85rem;
      font-style: italic;
    }

    /* ── Spinner ── */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: #1c1c1c;
      color: #e8e8e4;
      border: 1px solid #3a3a3a;
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.35s ease, opacity 0.3s ease;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.ok  { border-color: #22c55e; color: #22c55e; }
    .toast.err { border-color: #ef4444; color: #ef4444; }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      body { padding: 20px 14px 80px; }
      .input-row { flex-direction: column; }
      .btn-amber, .btn-red { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <div class="header">
    
    <h1>Notes<span>.</span></h1>
    <div class="header-eyebrow">Capture and manage your notes</div>
  </div>

  <!-- Create Note -->
  <div class="card" style="animation-delay: 0.06s">
    <div class="card-header">
      <div class="card-label">
        <span class="method-pill post">POST</span>
        <span class="route">/notes</span>
      </div>
      <span class="card-title">Create Note</span>
    </div>
    <div class="card-body">
      <div class="input-row">
        <input type="text" id="noteText" placeholder="Write your note…" autocomplete="off">
        <button class="btn btn-amber" id="createBtn" onclick="createNote()">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Save
        </button>
      </div>
      <div class="result" id="createResult"></div>
    </div>
  </div>

  <!-- All Notes -->
  <div class="card" style="animation-delay: 0.1s">
    <div class="card-header">
      <div class="card-label">
        <span class="method-pill get">GET</span>
        <span class="route">/notes</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="card-title">All Notes</span>
        <button class="btn btn-ghost" id="refreshBtn" onclick="loadAllNotes()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M1 6A5 5 0 0 1 10.5 3.5M11 1v3H8M11 6A5 5 0 0 1 1.5 8.5M1 11V8h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Refresh
        </button>
      </div>
    </div>
    <div class="card-body">
      <div id="notesList" class="notes-wrap">
        <div class="empty">Hit Refresh to load notes from the server.</div>
      </div>
    </div>
  </div>

  <!-- Fetch by ID -->
  <div class="card" style="animation-delay: 0.14s">
    <div class="card-header">
      <div class="card-label">
        <span class="method-pill get">GET</span>
        <span class="route">/notes/:id</span>
      </div>
      <span class="card-title">Look Up Note</span>
    </div>
    <div class="card-body">
      <div class="input-row">
        <input type="number" id="getId" placeholder="Note ID" min="1">
        <button class="btn btn-amber" id="fetchBtn" onclick="fetchNote()">Fetch</button>
      </div>
      <div class="result" id="fetchResult"></div>
    </div>
  </div>

  <!-- Delete Note -->
  <div class="card" style="animation-delay: 0.18s">
    <div class="card-header">
      <div class="card-label">
        <span class="method-pill del">DELETE</span>
        <span class="route">/notes/:id</span>
      </div>
      <span class="card-title">Delete Note</span>
    </div>
    <div class="card-body">
      <div class="input-row">
        <input type="number" id="deleteId" placeholder="Note ID" min="1">
        <button class="btn btn-red" id="deleteBtn" onclick="deleteNote()">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
            <path d="M2 3.5h9M5 3.5V2.5h3v1M4 3.5l.5 7h4l.5-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Delete
        </button>
      </div>
      <div class="result" id="deleteResult"></div>
    </div>
  </div>

</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script>

  // ── Toast ──────────────────────────────────────────────────────
  // Shows a small popup message at the bottom of the screen

  var toastTimer;

  function showToast(message, type) {
    var toastEl = document.getElementById('toast');
    toastEl.textContent = message;
    toastEl.className = 'toast show ' + type;

    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toastEl.classList.remove('show');
    }, 2600);
  }


  // ── Loading state ──────────────────────────────────────────────
  // Swaps button content with a spinner while waiting for the server

  function startLoading(buttonId) {
    var btn = document.getElementById(buttonId);
    btn.dataset.original = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;
  }

  function stopLoading(buttonId) {
    var btn = document.getElementById(buttonId);
    btn.innerHTML = btn.dataset.original;
    btn.disabled = false;
  }


  // ── Result box ─────────────────────────────────────────────────
  // Shows a green (ok) or red (err) message box below an input

  function showResult(boxId, type, html) {
    var box = document.getElementById(boxId);
    box.className = 'result visible ' + type;
    box.innerHTML = html;
  }

  function hideResult(boxId) {
    var box = document.getElementById(boxId);
    box.className = 'result';
  }


  // ── Format timestamp ───────────────────────────────────────────
  // Flask stores time as a Unix float e.g. 1718123456.78
  // This turns it into something readable like "Jun 11, 02:30 PM"

  function formatTime(timestamp) {
    if (!timestamp) return '';
    var date = new Date(parseFloat(timestamp) * 1000);
    if (isNaN(date.getTime())) return timestamp;
    return date.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }


  // ── Escape HTML ────────────────────────────────────────────────
  // Stops user text from breaking the page

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }


  // ── Render notes list ──────────────────────────────────────────
  // Builds HTML rows from the array returned by GET /notes
  // Flask returns each note as [id, text, createdAt]

  function renderNotes(notes) {
    var list = document.getElementById('notesList');

    if (notes.length === 0) {
      list.innerHTML = '<div class="empty">No notes found.</div>';
      return;
    }

    var html = '';

    for (var i = 0; i < notes.length; i++) {
      var note = notes[i];

      var id   = Array.isArray(note) ? note[0] : note.id;
      var text = Array.isArray(note) ? note[1] : note.text;
      var ts   = Array.isArray(note) ? note[2] : note.createdAt;

      html += '<div class="note-row" id="nr-' + id + '">';
      html +=   '<span class="note-id">#' + id + '</span>';
      html +=   '<div class="note-body">';
      html +=     '<div class="note-text">' + escapeHtml(text) + '</div>';
      html +=     '<div class="note-time">' + formatTime(ts) + '</div>';
      html +=   '</div>';
      html +=   '<button class="note-del" title="Delete" onclick="quickDelete(' + id + ')">';
      html +=     '<svg width="13" height="13" viewBox="0 0 13 13" fill="none">';
      html +=       '<path d="M2 3.5h9M5 3.5V2.5h3v1M4 3.5l.5 7h4l.5-7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>';
      html +=     '</svg>';
      html +=   '</button>';
      html += '</div>';
    }

    list.innerHTML = html;
  }


  // ── Remove a note row from the visible list ────────────────────

  function removeNoteRow(id) {
    var row = document.getElementById('nr-' + id);
    if (row) {
      row.remove();
    }
  }


  // ── Create Note  POST /notes ───────────────────────────────────

  function createNote() {
    var input = document.getElementById('noteText');
    var text = input.value.trim();

    if (!text) {
      input.focus();
      showToast('Write something first.', 'err');
      return;
    }

    startLoading('createBtn');

    fetch('/notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    })
    .then(function(response) {
      return response.json().then(function(data) {
        if (!response.ok) throw new Error(data.error || 'Failed');
        return data;
      });
    })
    .then(function(data) {
      input.value = '';
      input.focus();
      showResult('createResult', 'ok', '<span class="rl">201 Created</span>' + data.response);
      showToast('Note saved!', 'ok');
      loadAllNotes();
    })
    .catch(function(error) {
      showResult('createResult', 'err', '<span class="rl">Error</span>' + error.message);
      showToast(error.message, 'err');
    })
    .finally(function() {
      stopLoading('createBtn');
    });
  }

  document.getElementById('noteText').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') createNote();
  });


  // ── Load All Notes  GET /notes ─────────────────────────────────

  function loadAllNotes() {
    startLoading('refreshBtn');

    fetch('/notes')
    .then(function(response) {
      if (!response.ok) throw new Error('Failed to load');
      return response.json();
    })
    .then(function(data) {
      renderNotes(data);
      showToast(data.length + ' note' + (data.length !== 1 ? 's' : '') + ' loaded', 'ok');
    })
    .catch(function(error) {
      document.getElementById('notesList').innerHTML = '<div class="empty" style="color:#f87171">' + error.message + '</div>';
      showToast(error.message, 'err');
    })
    .finally(function() {
      stopLoading('refreshBtn');
    });
  }


  // ── Fetch Single Note  GET /notes/:id ──────────────────────────

  function fetchNote() {
    var id = document.getElementById('getId').value;

    if (!id) {
      showToast('Enter a note ID.', 'err');
      return;
    }

    startLoading('fetchBtn');
    hideResult('fetchResult');

    fetch('/notes/' + id)
    .then(function(response) {
      return response.json().then(function(data) {
        if (response.status === 404) throw new Error('Note not found');
        if (!response.ok) throw new Error(data.error || 'Error');
        return data;
      });
    })
    .then(function(data) {
      var html = '<span class="rl">200 OK</span>';
      html += '<b>ID:</b> ' + data.id + '<br>';
      html += '<b>Text:</b> ' + escapeHtml(data.text) + '<br>';
      html += '<b>Created:</b> ' + formatTime(data.createdAt);
      showResult('fetchResult', 'ok', html);
    })
    .catch(function(error) {
      showResult('fetchResult', 'err', '<span class="rl">Error</span>' + error.message);
      showToast(error.message, 'err');
    })
    .finally(function() {
      stopLoading('fetchBtn');
    });
  }

  document.getElementById('getId').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') fetchNote();
  });


  // ── Delete Note  DELETE /notes/:id ─────────────────────────────

  function deleteNote() {
    var id = document.getElementById('deleteId').value;

    if (!id) {
      showToast('Enter a note ID.', 'err');
      return;
    }

    startLoading('deleteBtn');
    hideResult('deleteResult');

    fetch('/notes/' + id, { method: 'DELETE' })
    .then(function(response) {
      if (response.status === 204) {
        showResult('deleteResult', 'ok', '<span class="rl">204 No Content</span>Note #' + id + ' deleted successfully.');
        document.getElementById('deleteId').value = '';
        showToast('Note deleted!', 'ok');
        removeNoteRow(id);
        return;
      }
      return response.json().then(function(data) {
        throw new Error(data.error || 'Not found');
      });
    })
    .catch(function(error) {
      showResult('deleteResult', 'err', '<span class="rl">Error</span>' + error.message);
      showToast(error.message, 'err');
    })
    .finally(function() {
      stopLoading('deleteBtn');
    });
  }

  document.getElementById('deleteId').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') deleteNote();
  });


  // ── Quick delete from the list ─────────────────────────────────
  // Called by the trash icon button on each note row

  function quickDelete(id) {
    fetch('/notes/' + id, { method: 'DELETE' })
    .then(function(response) {
      if (response.status === 204) {
        removeNoteRow(id);
        showToast('Note deleted!', 'ok');
      } else {
        return response.json().then(function(data) {
          showToast(data.error || 'Error', 'err');
        });
      }
    })
    .catch(function(error) {
      showToast(error.message, 'err');
    });
  }

</script>
</body>
</html>
