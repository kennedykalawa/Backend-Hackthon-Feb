<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Mulish:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141414;
      --surface: #1c1c1c;
      --surface2: #242424;
      --border: #2e2e2e;
      --border2: #3a3a3a;
      --amber: #f59e0b;
      --amber-dim: rgba(245,158,11,0.12);
      --amber-hover: #fbbf24;
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.1);
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.1);
      --text: #e8e8e4;
      --text-muted: #737370;
      --text-dim: #4a4a46;
      --radius: 10px;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Mulish', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 20px 80px;
    }
    .app { max-width: 620px; margin: 0 auto; }
    .header { margin-bottom: 40px; animation: fadeUp 0.5s ease both; }
    .header-eyebrow { font-family: var(--mono); font-size: 0.7rem; color: var(--amber); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; opacity: 0.8; }
    .header h1 { font-family: 'Syne', sans-serif; font-size: clamp(2.4rem, 7vw, 3.4rem); font-weight: 800; letter-spacing: -1.5px; line-height: 1; color: var(--text); }
    .header h1 span { color: var(--amber); }
    .header-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; font-weight: 300; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; animation: fadeUp 0.5s ease both; }
    .card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); gap: 10px; }
    .card-label { display: flex; align-items: center; gap: 10px; }
    .method-pill { font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 4px; }
    .post { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .get  { background: rgba(34,197,94,0.12);  color: #4ade80; }
    .del  { background: rgba(239,68,68,0.12);  color: #f87171; }
    .route { font-family: var(--mono); font-size: 0.75rem; color: var(--text-muted); }
    .card-title { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .card-body { padding: 16px 18px; }
    .input-row { display: flex; gap: 8px; align-items: stretch; }
    input[type="text"], input[type="number"] { flex: 1; font-family: 'Mulish', sans-serif; font-size: 0.9rem; color: var(--text); background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; }
    input::placeholder { color: var(--text-dim); }
    input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }
    .btn { font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 600; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; transition: all 0.18s ease; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; letter-spacing: 0.2px; }
    .btn:active { transform: scale(0.96); }
    .btn-amber { background: var(--amber); color: #0a0a0a; }
    .btn-amber:hover { background: var(--amber-hover); box-shadow: 0 4px 16px rgba(245,158,11,0.3); }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover { background: #dc2626; box-shadow: 0 4px 16px rgba(239,68,68,0.3); }
    .btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border2); padding: 6px 12px; font-size: 0.78rem; }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
    .result { margin-top: 12px; border-radius: 8px; padding: 12px 14px; font-family: var(--mono); font-size: 0.8rem; line-height: 1.7; display: none; animation: fadeUp 0.25s ease both; border-left: 3px solid transparent; }
    .result.visible { display: block; }
    .result.ok  { background: var(--green-dim); border-left-color: var(--green); color: #86efac; }
    .result.err { background: var(--red-dim);   border-left-color: var(--red);   color: #fca5a5; }
    .result .rl { color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 6px; }
    .result b   { color: var(--text); font-weight: 500; }
    .notes-wrap { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .note-row { display: flex; align-items: flex-start; gap: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; animation: slideIn 0.28s cubic-bezier(0.34,1.4,0.64,1) both; transition: border-color 0.18s; }
    .note-row:hover { border-color: var(--border2); }
    .note-id { font-family: var(--mono); font-size: 0.7rem; color: var(--amber); padding-top: 2px; min-width: 26px; opacity: 0.7; }
    .note-body { flex: 1; min-width: 0; }
    .note-text { font-size: 0.88rem; color: var(--text); line-height: 1.5; word-break: break-word; }
    .note-time { font-family: var(--mono); font-size: 0.68rem; color: var(--text-dim); margin-top: 4px; }
    .note-del { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: color 0.15s, background 0.15s; flex-shrink: 0; opacity: 0; }
    .note-row:hover .note-del { opacity: 1; }
    .note-del:hover { color: var(--red); background: var(--red-dim); }
    .note-row.removing { animation: slideOut 0.25s ease forwards; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.15); border-top-color: currentColor; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
    .empty { text-align: center; padding: 32px 20px; color: var(--text-dim); font-size: 0.85rem; font-style: italic; }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(70px); background: var(--surface); color: var(--text); border: 1px solid var(--border2); font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 600; padding: 10px 20px; border-radius: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); z-index: 1000; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s; opacity: 0; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.ok  { border-color: var(--green); color: var(--green); }
    .toast.err { border-color: var(--red);   color: var(--red); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px) scale(0.98); } to { opacity: 1; transform: none; } }
    @keyframes slideOut { to { opacity: 0; transform: translateX(10px) scale(0.97); max-height: 0; padding: 0; margin: 0; overflow: hidden; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      body { padding: 20px 14px 80px; }
      .input-row { flex-direction: column; }
      .btn-amber, .btn-red { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <!-- <div class="header-eyebrow">Flask · SQLite · REST</div> -->
    <h1>Notes<span>.</span></h1>
   <!--  <p class="header-sub">Connected to your backend at <code style="font-family:var(--mono);color:var(--amber);font-size:0.8rem">localhost:5000</code></p> -->
  </div>

  <!-- Create -->
  <div class="card" style="animation-delay:0.06s">
    <div class="card-header">
      <div class="card-label">
        <span class="method-pill post">POST</span>
        <span class="route">/notes</span>
      </div>
      <span class="card-title">Create Note</span>
    </div>
    <div class="card-body">
      <div class="input-row">
        <input type="text" id="noteText" placeholder="Write your note…" autocomplete="off" onkeydown="if(event.key==='Enter') createNote()">
        <button class="btn btn-amber" id="createBtn" onclick="createNote()">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Save
        </button>
      </div>
      <div class="result" id="createResult"></div>
    </div>
  </div>

  <!-- All Notes -->
  <div class="card" style="animation-delay:0.1s">
    <div class="card-header">
      <div class="card-label">
        <span class="method-pill get">GET</span>
        <span class="route">/notes</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="card-title">All Notes</span>
        <button class="btn btn-ghost" id="refreshBtn" onclick="loadAllNotes()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 6A5 5 0 0 1 10.5 3.5M11 1v3H8M11 6A5 5 0 0 1 1.5 8.5M1 11V8h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Refresh
        </button>
      </div>
    </div>
    <div class="card-body">
      <div id="notesList" class="notes-wrap">
        <div class="empty">Hit Refresh to load notes from the server.</div>
      </div>
    </div>
  </div>

  <!-- Fetch by ID -->
  <div class="card" style="animation-delay:0.14s">
    <div class="card-header">
      <div class="card-label">
        <span class="method-pill get">GET</span>
        <span class="route">/notes/:id</span>
      </div>
      <span class="card-title">Look Up Note</span>
    </div>
    <div class="card-body">
      <div class="input-row">
        <input type="number" id="getId" placeholder="Note ID" min="1" onkeydown="if(event.key==='Enter') fetchNote()">
        <button class="btn btn-amber" id="fetchBtn" onclick="fetchNote()">Fetch</button>
      </div>
      <div class="result" id="fetchResult"></div>
    </div>
  </div>

  <!-- Delete -->
  <div class="card" style="animation-delay:0.18s">
    <div class="card-header">
      <div class="card-label">
        <span class="method-pill del">DELETE</span>
        <span class="route">/notes/:id</span>
      </div>
      <span class="card-title">Delete Note</span>
    </div>
    <div class="card-body">
      <div class="input-row">
        <input type="number" id="deleteId" placeholder="Note ID" min="1" onkeydown="if(event.key==='Enter') deleteNote()">
        <button class="btn btn-red" id="deleteBtn" onclick="deleteNote()">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M5 3.5V2.5h3v1M4 3.5l.5 7h4l.5-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Delete
        </button>
      </div>
      <div class="result" id="deleteResult"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
let toastTimer;
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) { btn._orig = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true; }
  else { btn.innerHTML = btn._orig; btn.disabled = false; }
}

function showResult(id, type, html) {
  const el = document.getElementById(id);
  el.className = `result visible ${type}`;
  el.innerHTML = html;
}

function hideResult(id) { document.getElementById(id).className = 'result'; }

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(parseFloat(ts) * 1000);
  return isNaN(d.getTime()) ? ts : d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function renderNotes(notes) {
  const list = document.getElementById('notesList');
  if (!notes.length) { list.innerHTML = '<div class="empty">No notes found.</div>'; return; }
  list.innerHTML = notes.map((n, i) => {
    const id   = Array.isArray(n) ? n[0] : n.id;
    const text = Array.isArray(n) ? n[1] : n.text;
    const ts   = Array.isArray(n) ? n[2] : n.createdAt;
    return `<div class="note-row" id="nr-${id}" style="animation-delay:${i*0.03}s">
      <span class="note-id">#${id}</span>
      <div class="note-body">
        <div class="note-text">${escHtml(text)}</div>
        <div class="note-time">${fmtTime(ts)}</div>
      </div>
      <button class="note-del" title="Delete" onclick="quickDelete(${id})">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M5 3.5V2.5h3v1M4 3.5l.5 7h4l.5-7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>`;
  }).join('');
}

async function createNote() {
  const input = document.getElementById('noteText');
  const text = input.value.trim();
  if (!text) { input.focus(); toast('Write something first.', 'err'); return; }
  setLoading('createBtn', true);
  try {
    const res = await fetch('/notes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    input.value = '';
    input.focus();
    showResult('createResult', 'ok', `<span class="rl">201 Created</span>${data.response}`);
    toast('Note saved!');
    loadAllNotes();
  } catch(e) {
    showResult('createResult', 'err', `<span class="rl">Error</span>${e.message}`);
    toast(e.message, 'err');
  } finally { setLoading('createBtn', false); }
}

async function loadAllNotes() {
  setLoading('refreshBtn', true);
  try {
    const res = await fetch('/notes');
    const data = await res.json();
    if (!res.ok) throw new Error('Failed to load');
    renderNotes(data);
    toast(`${data.length} note${data.length !== 1 ? 's' : ''} loaded`);
  } catch(e) {
    document.getElementById('notesList').innerHTML = `<div class="empty" style="color:#f87171">${e.message}</div>`;
    toast(e.message, 'err');
  } finally { setLoading('refreshBtn', false); }
}

async function fetchNote() {
  const id = document.getElementById('getId').value;
  if (!id) { toast('Enter a note ID.', 'err'); return; }
  setLoading('fetchBtn', true);
  hideResult('fetchResult');
  try {
    const res = await fetch(`/notes/${id}`);
    const data = await res.json();
    if (res.status === 404) throw new Error('Note not found');
    if (!res.ok) throw new Error(data.error || 'Error');
    showResult('fetchResult', 'ok',
      `<span class="rl">200 OK</span><b>ID:</b> ${data.id}<br><b>Text:</b> ${escHtml(data.text)}<br><b>Created:</b> ${fmtTime(data.createdAt)}`);
  } catch(e) {
    showResult('fetchResult', 'err', `<span class="rl">Error</span>${e.message}`);
    toast(e.message, 'err');
  } finally { setLoading('fetchBtn', false); }
}

async function deleteNote() {
  const id = document.getElementById('deleteId').value;
  if (!id) { toast('Enter a note ID.', 'err'); return; }
  setLoading('deleteBtn', true);
  hideResult('deleteResult');
  try {
    const res = await fetch(`/notes/${id}`, { method:'DELETE' });
    if (res.status === 204) {
      showResult('deleteResult', 'ok', `<span class="rl">204 No Content</span>Note #${id} deleted successfully.`);
      document.getElementById('deleteId').value = '';
      toast('Note deleted!');
      animateRemove(id);
    } else {
      const data = await res.json();
      throw new Error(data.error || 'Not found');
    }
  } catch(e) {
    showResult('deleteResult', 'err', `<span class="rl">Error</span>${e.message}`);
    toast(e.message, 'err');
  } finally { setLoading('deleteBtn', false); }
}

async function quickDelete(id) {
  try {
    const res = await fetch(`/notes/${id}`, { method:'DELETE' });
    if (res.status === 204) { animateRemove(id); toast('Note deleted!'); }
    else { const d = await res.json(); toast(d.error || 'Error', 'err'); }
  } catch(e) { toast(e.message, 'err'); }
}

function animateRemove(id) {
  const el = document.getElementById(`nr-${id}`);
  if (el) { el.classList.add('removing'); setTimeout(() => el.remove(), 260); }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
